<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Persistent side-agent answer workflow</title>
  <desc id="desc">Four stages animate in sequence: ask a persistent specialist, receive an answer in the parent inbox, attach it to the parent draft, and explicitly send the parent message.</desc>
  <defs>
    <style>
      .bg{fill:#f3f4f6}.surface{fill:#fff}.line{stroke:#d1d5db;stroke-width:1.5}.text{fill:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#6b7280;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:20px;font-weight:700}.body{font-size:13px}.small{font-size:11px}.green{fill:#15803d}.green-bg{fill:#ecfdf5}.blue{fill:#1d4ed8}.blue-bg{fill:#eff6ff}.action{fill:#16a34a}.white{fill:#fff}.arrow{stroke:#16a34a;stroke-width:3;fill:none;marker-end:url(#arrowhead)}
      .stage{opacity:.34;animation:focus 8s infinite}.s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.pulse{animation:pulse 8s infinite}.p2{animation-delay:2s}.p3{animation-delay:4s}.p4{animation-delay:6s}
      @keyframes focus{0%,24%{opacity:1;transform:translateY(-4px)}25%,100%{opacity:.34;transform:translateY(0)}}
      @keyframes pulse{0%,24%{stroke-width:5;opacity:1}25%,100%{stroke-width:3;opacity:.25}}
      @media (prefers-reduced-motion:reduce){.stage,.pulse{animation:none!important;opacity:1!important;transform:none!important}}
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#16a34a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="520" class="bg"/>
  <text x="40" y="42" class="text title">Persistent side-agent workflow</text>
  <text x="40" y="65" class="muted body">Answers stay separate until the human attaches and sends them.</text>

  <g class="stage s1" transform="translate(40 105)" filter="url(#shadow)">
    <rect width="245" height="310" rx="14" class="surface line"/>
    <text x="18" y="27" class="muted small">1 · ASK SPECIALIST</text>
    <text x="18" y="51" class="text title">Architecture</text>
    <rect x="16" y="74" width="213" height="70" rx="9" class="blue-bg line"/>
    <text x="28" y="96" class="blue small">PARENT QUESTION</text>
    <text x="28" y="118" class="text body">Where should idempotency live?</text>
    <rect x="16" y="162" width="213" height="91" rx="9" class="green-bg line"/>
    <text x="28" y="184" class="green small">SPECIALIST ANSWER</text>
    <text x="28" y="207" class="text body">Reserve before the external call.</text>
    <text x="28" y="228" class="muted small">Context retained for follow-ups.</text>
    <rect x="107" y="268" width="122" height="29" rx="6" class="action"/><text x="168" y="287" text-anchor="middle" class="white small">Answer ready</text>
  </g>
  <path d="M295 255H329" class="arrow pulse p2"/>

  <g class="stage s2" transform="translate(340 105)" filter="url(#shadow)">
    <rect width="245" height="310" rx="14" class="surface line"/>
    <text x="18" y="27" class="muted small">2 · PARENT INBOX</text>
    <text x="18" y="51" class="text title">Answers</text>
    <rect x="194" y="18" width="32" height="22" rx="11" fill="#dc2626"/><text x="210" y="33" text-anchor="middle" class="white small">1</text>
    <rect x="16" y="74" width="213" height="140" rx="9" class="surface line"/>
    <text x="28" y="96" class="blue small">ARCHITECTURE · UNREAD</text>
    <text x="28" y="119" class="text body">Move idempotency before payment</text>
    <text x="28" y="141" class="muted small">Persist the key with the pending</text>
    <text x="28" y="159" class="muted small">order; return it on retries.</text>
    <rect x="145" y="174" width="72" height="28" rx="6" class="action"/><text x="181" y="193" text-anchor="middle" class="white small">Attach</text>
    <text x="18" y="249" class="muted small">Completion did not wake the parent.</text>
    <text x="18" y="271" class="muted small">The answer waits durably for intent.</text>
  </g>
  <path d="M595 255H629" class="arrow pulse p3"/>

  <g class="stage s3" transform="translate(640 105)" filter="url(#shadow)">
    <rect width="245" height="310" rx="14" class="surface line"/>
    <text x="18" y="27" class="muted small">3 · ATTACH TO DRAFT</text>
    <text x="18" y="51" class="text title">Parent composer</text>
    <rect x="16" y="74" width="213" height="84" rx="9" class="blue-bg line"/>
    <text x="28" y="96" class="blue small">SPECIALIST CONTEXT</text>
    <text x="28" y="119" class="text body">Architecture answer attached</text>
    <text x="28" y="140" class="muted small">Not sent yet · Remove</text>
    <rect x="16" y="174" width="213" height="73" rx="9" class="surface line"/>
    <text x="28" y="199" class="text body">Turn this into an implementation</text>
    <text x="28" y="220" class="text body">plan with rollout gates.</text>
    <rect x="157" y="264" width="72" height="32" rx="6" class="action"/><text x="193" y="285" text-anchor="middle" class="white small">Send</text>
  </g>
  <path d="M895 255H929" class="arrow pulse p4"/>

  <g class="stage s4" transform="translate(940 105)" filter="url(#shadow)">
    <rect width="220" height="310" rx="14" class="surface line"/>
    <text x="18" y="27" class="muted small">4 · EXPLICITLY SENT</text>
    <text x="18" y="51" class="text title">Parent transcript</text>
    <rect x="16" y="74" width="188" height="95" rx="9" fill="#f3f4f6"/>
    <text x="28" y="96" class="muted small">YOU</text>
    <text x="28" y="119" class="text body">Turn this into a plan.</text>
    <text x="28" y="145" class="blue small">Specialist context · 1</text>
    <rect x="16" y="184" width="188" height="91" rx="9" class="blue-bg line"/>
    <text x="28" y="206" class="blue small">ARCHITECTURE SNAPSHOT</text>
    <text x="28" y="229" class="text body">Move idempotency before</text>
    <text x="28" y="250" class="text body">payment authorization.</text>
    <text x="28" y="294" class="green small">DELIVERED ONCE</text>
  </g>

  <rect x="40" y="451" width="1120" height="42" rx="10" class="surface line"/>
  <text x="60" y="477" class="text body">Non-negotiable: Attach is not Send · missing evidence stays Interrupted · retries create a new question ID · parent context preserves specialist provenance</text>
</svg>
