name: PR screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This workflow executes the PR checkout. It deliberately has no write permission
# and receives no repository secrets, including for pull requests from forks.
permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Select review coverage without AI keys
        id: selection
        run: |
          npx tsx scripts/select-review-captures.ts "$RUNNER_TEMP/review-requests.json" "$RUNNER_TEMP/review-coverage.json"
          echo "count=$(jq length "$RUNNER_TEMP/review-requests.json")" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        if: steps.selection.outputs.count != '0'
        run: npx playwright install --with-deps chromium

      - name: Capture and validate screenshots
        run: >-
          npm run screenshots --
          --request-file "$RUNNER_TEMP/review-requests.json"
          --coverage-file "$RUNNER_TEMP/review-coverage.json"
          --output-dir screenshot-output
          --pr-number "${{ github.event.pull_request.number }}"
          --sha "${{ github.event.pull_request.head.sha }}"

      - name: Upload validated bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: screenshot-output/
          if-no-files-found: error
          retention-days: 30
